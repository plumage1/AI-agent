<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 求职助手 Agent</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="侧边栏">
        <div class="sidebar-top">
          <div class="brand-row">
            <div class="brand-lockup">
              <div class="brand-mark">JG</div>
              <div>
                <div class="brand-eyebrow">AI 求职助手</div>
                <div class="brand-title">工作在哪里</div>
              </div>
            </div>
          </div>

          <button id="newChat" class="side-action">＋ 新对话</button>
          <button class="side-action" data-prompt="帮我分析这段 JD：需要 Python、Redis、Docker 和 RAG 项目经验">⌕ JD 分析</button>
          <button class="side-action" data-prompt="帮我制定一个 RAG Agent 求职项目的学习计划">▣ 学习计划</button>
          <button class="side-action" data-prompt="Redis 缓存雪崩是什么？面试怎么回答？">◇ RAG 问答</button>
        </div>

        <div class="history-section">
          <div class="section-label">最近对话</div>
          <div id="recentList" class="history-list"></div>
        </div>

        <div class="sidebar-bottom">
          <label class="compact-field">
            <span>Session</span>
            <input id="sessionId" value="web_user" />
          </label>
          <label class="compact-field">
            <span>Admin Token</span>
            <input id="adminToken" type="password" placeholder="导入知识库时需要" />
          </label>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-topbar">
          <button id="openSidebar" class="icon-button sidebar-toggle" title="切换侧边栏" aria-label="切换侧边栏">☰</button>
          <div class="title-stack">
            <div class="chat-title-row">
              <div class="chat-title">工作在哪里</div>
            </div>
            <div id="statusText" class="chat-subtitle">Function Calling · Hybrid RAG · Trace</div>
          </div>
          <div class="top-actions">
            <button id="healthButton" class="ghost-button">状态</button>
          </div>
        </header>

        <section class="insight-strip" aria-label="能力标签">
          <span class="insight-pill">多模态文件解析</span>
          <span class="insight-pill">知识库检索引用</span>
          <span class="insight-pill">简历 JD 匹配</span>
          <span class="insight-pill">求职 Workflow</span>
        </section>

        <section id="agentPanel" class="agent-panel hidden" aria-label="Agent 进度">
          <div class="agent-panel-head">
            <div>
              <div class="agent-kicker">Agent Loop</div>
              <strong id="agentGoalTitle">Goal</strong>
            </div>
            <span id="agentStatusBadge" class="agent-status-badge">idle</span>
          </div>
          <div id="agentGoal" class="agent-goal"></div>
          <div class="agent-grid">
            <div class="agent-card">
              <div class="agent-card-title">Plan</div>
              <div id="agentPlan" class="agent-list"></div>
            </div>
            <div class="agent-card">
              <div class="agent-card-title">Progress</div>
              <div id="agentProgress" class="agent-list"></div>
            </div>
          </div>
          <div class="agent-footer">
            <div class="agent-card agent-card-inline">
              <div class="agent-card-title">Next Action</div>
              <div id="agentNextAction" class="agent-inline-text"></div>
            </div>
            <div class="agent-card agent-card-inline">
              <div class="agent-card-title">Final Summary</div>
              <div id="agentFinalSummary" class="agent-inline-text"></div>
            </div>
          </div>
        </section>

        <section id="toolPanel" class="tool-panel hidden">
          <div class="tool-panel-header">
            <div>
              <strong>专项工具</strong>
              <span>专项任务可以直接跑，不用跳出聊天流</span>
            </div>
            <button id="closeTools" class="icon-button" title="关闭" aria-label="关闭">×</button>
          </div>

          <div class="tool-grid">
            <button class="tool-card" data-tool="workflow">
              <strong>Workflow</strong>
              <span>简历 + JD 一键生成准备方案</span>
            </button>
            <button class="tool-card" data-tool="match">
              <strong>Match</strong>
              <span>计算匹配度和缺口关键词</span>
            </button>
            <button class="tool-card" data-tool="rag">
              <strong>RAG Search</strong>
              <span>检索知识库并返回引用</span>
            </button>
            <button class="tool-card" data-tool="interview">
              <strong>Interview</strong>
              <span>生成面试题并追问反馈</span>
            </button>
          </div>

          <div id="toolForm" class="tool-form hidden"></div>
        </section>

        <section id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="message-body">
              <p>你好，我是你的求职 Agent。可以帮你分析 JD、匹配简历、检索知识库、生成学习计划和模拟面试。</p>
              <div class="suggestions">
                <button data-prompt="帮我分析这段 JD：需要 Python、Redis、Docker 和 RAG 项目经验">分析 JD</button>
                <button data-prompt="我的简历熟悉 Python、FastAPI、Redis，做过 RAG Agent 项目。帮我匹配 JD：需要 Python、Redis、Docker 和 RAG 项目经验。">匹配简历</button>
                <button data-prompt="Redis RDB 和 AOF 有什么区别？">问知识库</button>
              </div>
            </div>
          </article>
        </section>

        <section class="composer-wrap">
          <div id="statusBanner" class="status-banner hidden"></div>

          <div id="attachMenu" class="attach-menu hidden">
            <button type="button" class="attach-option" data-attach-kind="resume">
              <strong>上传简历</strong>
              <span>PDF、图片或文本，直接解析技能点</span>
            </button>
            <button type="button" class="attach-option" data-attach-kind="jd">
              <strong>上传 JD / 图片</strong>
              <span>识别岗位关键词和准备重点</span>
            </button>
            <button type="button" class="attach-option" data-attach-kind="knowledge">
              <strong>导入知识库</strong>
              <span>支持 PDF、图片、TXT、Markdown</span>
            </button>
            <button type="button" class="attach-option" data-attach-kind="tools">
              <strong>打开专项工具</strong>
              <span>切到 Workflow、Match、RAG、Interview</span>
            </button>
          </div>

          <div id="dropHint" class="drop-hint hidden">松开即可把文件添加到聊天框</div>
          <div id="pendingAttachments" class="attachment-tray hidden"></div>

          <input id="resumeUploadInput" class="sr-only" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp" />
          <input id="jdUploadInput" class="sr-only" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp" />
          <input id="knowledgeUploadInput" class="sr-only" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp" />

          <form id="chatForm" class="composer">
            <button id="attachButton" type="button" class="composer-icon" title="添加文件或工具" aria-label="添加文件或工具">＋</button>
            <textarea id="chatMessage" rows="1" placeholder="想问什么都可以，也可以先传一份 PDF 或图片"></textarea>
            <button id="sendChat" type="submit" class="send-button" title="发送" aria-label="发送">↑</button>
          </form>
          <div class="composer-hint">支持把 PDF、截图和文本资料串进求职工作流；重要材料依然建议你自己复核。</div>
        </section>
      </main>
    </div>

    <script src="/ui/app.js"></script>
  </body>
</html>
